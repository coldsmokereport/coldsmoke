{% extends "base.html" %}
{% block title %}{{ post.title }} — {{ site_title }}{% endblock %}
{% block content %}
<article class="post">
  <header class="post-head">
    <p class="post-date">{{ post.date|datefmt }}</p>
    <h2 class="post-title">{{ post.title }}</h2>
  </header>
  <div class="post-body">{{ post.body|safe }}</div>
  {% if post.tags %}
  <p class="post-tags">
    {% for t in post.tags %}<a class="tag" href="{{ base }}/tags/{{ t }}/">{{ t }}</a>{% endfor %}
  </p>
  {% endif %}
</article>
{% endblock %}
