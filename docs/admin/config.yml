backend:
  name: github
  repo: coldsmokereport/coldsmoke
  branch: main

# Uploaded images are committed to posts/images/ and copied by build.py to
# docs/assets/images/, served under the site's /coldsmoke base. Sveltia CMS
# requires public_folder to be a root-relative path, not an absolute URL.
media_folder: posts/images
public_folder: "/coldsmoke/assets/images"

site_url: https://coldsmokereport.github.io/coldsmoke
display_url: https://coldsmokereport.github.io/coldsmoke

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: posts
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime,
          format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: Tags, name: tags, widget: list, default: [forecast],
          required: false }
      - { label: Draft, name: draft, widget: boolean, default: false,
          required: false,
          hint: "Drafts are skipped by the site build" }
      - { label: "Link-preview summary", name: description, widget: text,
          required: false,
          hint: "One or two sentences shown when the post is shared. Blank = the post's opening lines." }
      - { label: "Link-preview image", name: image, widget: image,
          required: false,
          hint: "Blank = the first image in the post." }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: pages/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
